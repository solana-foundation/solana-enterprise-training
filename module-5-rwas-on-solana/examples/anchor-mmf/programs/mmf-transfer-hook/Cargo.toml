[package]
name = "mmf-transfer-hook"
version = "0.1.0"
description = "Token-2022 transfer hook for MMF - enforces a per-(mint, owner) rate limit on every transfer."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "mmf_transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "1.0.0"
anchor-spl  = "1.0.0"

spl-tlv-account-resolution = "0.11.1"
spl-discriminator           = "0.5.2"
spl-transfer-hook-interface = "2.1.0"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
